site:
  name: Točkica na i
  site: 'https://tockicanai.hr'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: Točkica na i
    template: '%s | Točkica na i'
  description: 'Točkica na i website.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Točkica na i
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: ''
    site: ''
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false # Client layer: set true when the client wants a blog. See SETUP.md.
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # TODO(client): GA4 Measurement ID, not given yet (intake)
      requireConsent: true # EU/GDPR: gate GA behind opt-in consent (src/components/client/CookieConsent.astro)

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
